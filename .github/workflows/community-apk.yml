name: Community APK
on:
  push:
    branches:
      - nekobox-community
    tags:
      - 'nekobox-community-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                sdkmanager_path="$candidate"
                break
              fi
            done
          fi
          if [ ! -x "$sdkmanager_path" ]; then
            echo "::error::Android SDK manager not found under $ANDROID_HOME"
            exit 1
          fi
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install 'platforms;android-37.0' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - name: Compile native core
        run: ./run lib core
      - name: Fetch rule assets
        run: ./run init action gradle
      - name: Build installable test APKs
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          BUILD_PLUGIN: none
        run: ./gradlew --no-daemon app:testOssDebugUnitTest app:assembleOssDebug
      - name: Build and sign APKs
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        env:
          BUILD_PLUGIN: none
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configure a community signing keystore}"
          : "${KEYSTORE_PASS:?Configure the keystore password}"
          : "${ALIAS_NAME:?Configure the key alias}"
          : "${ALIAS_PASS:?Configure the key password}"
          export KEYSTORE_FILE="$RUNNER_TEMP/community.keystore"
          trap 'rm -f -- "$KEYSTORE_FILE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          unset KEYSTORE_BASE64
          ./gradlew --no-daemon app:assembleOssRelease
      - name: Verify APK signatures and package names
        env:
          BUILD_TYPE: ${{ (github.event_name == 'push' && github.ref_type == 'branch') && 'debug' || 'release' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "app/build/outputs/apk/oss/$BUILD_TYPE"
          apks=(./*.apk)
          test "${#apks[@]}" -eq 4
          tools="$ANDROID_HOME/build-tools/36.1.0"
          package=moe.nb4a.community
          if [ "$BUILD_TYPE" = debug ]; then
            package+=.debug
          fi
          for apk in "${apks[@]}"; do
            "$tools/apksigner" verify "$apk"
            "$tools/aapt" dump badging "$apk" | sed -n '1p' | grep -F "package: name='$package'"
          done
          for abi in arm64-v8a x86_64; do
            apk=(./*"$abi"*.apk)
            test "${#apk[@]}" -eq 1
            unzip -p "${apk[0]}" "lib/$abi/libgojni.so" > "$RUNNER_TEMP/libgojni-$abi.so"
            alignments="$(readelf -lW "$RUNNER_TEMP/libgojni-$abi.so" | awk '$1 == "LOAD" {print $NF}')"
            test -n "$alignments"
            while IFS= read -r alignment; do
              (( alignment >= 16384 ))
            done <<< "$alignments"
          done
          version="$(sed -n 's/^VERSION_NAME=//p' "$GITHUB_WORKSPACE/nb4a.properties")"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            apk=(./*-"$abi"-*.apk)
            test "${#apk[@]}" -eq 1
            mv -- "${apk[0]}" "NekoBox-$version-$abi-$BUILD_TYPE.apk"
          done
          sha256sum ./*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NekoBox-community-apks
          path: |
            app/build/outputs/apk/oss/*/*.apk
            app/build/outputs/apk/oss/*/SHA256SUMS
          if-no-files-found: error
